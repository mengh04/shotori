[package]
name = "shotori"
version = "0.5.0"
edition = "2024"
description = "Shotori — Wayland-first screenshot tool built with gpui-kit"
license = "MIT"
repository = "https://github.com/mengh04/shotori"
keywords = ["screenshot", "wayland", "gpui", "screencopy", "clipboard"]
categories = ["graphics", "multimedia::images", "command-line-utilities"]
# 有多个 bin（shotori / screencap）时，裸 `cargo run` 默认跑主程序
default-run = "shotori"

[dependencies]
gpui-kit = "0.6"
anyhow = "1.0"

# screencopy 截图 + wlr-data-control 剪贴板（裸 wayland-client）
wayland-client = "0.31"
wayland-protocols-wlr = "0.3"
memmap2 = "0.9"
tempfile = "3"
png = "0.17"

# 内存图像 → gpui 显示（RenderImage 由 image crate 的 Frame 构成，
# 必须与 gpui-pre 同版本，当前 0.25.10）
image = "0.25"
smallvec = "1"

# 保存文件名的人类可读时间戳（gpui 生态已在依赖树中，零新增编译）
chrono = "0.4"

# 贴图功能（依赖 vendor 的 set_layer_margin 补丁）在 `pin` 分支保存；
# 上游合并补丁后可合回主干并恢复此处 [patch.crates-io] 或直接用上游版本
