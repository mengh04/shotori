[package]
name = "shotori"
version = "0.4.0"
edition = "2024"
publish = false
description = "Shotori — Wayland-first screenshot & OCR suite built with gpui-kit"
# 有多个 bin（shotori / screencap）时，裸 `cargo run` 默认跑主程序
default-run = "shotori"

[dependencies]
gpui-kit = "0.6"
anyhow = "1.0"

# ── spike #2：裸 wayland-client 实现 screencopy 截图 ──
wayland-client = "0.31"
wayland-protocols-wlr = "0.3"
memmap2 = "0.9"
tempfile = "3"
png = "0.17"

# 内存图像 → gpui 显示（RenderImage 由 image crate 的 Frame 构成，
# 必须与 gpui-pre 同版本，当前 0.25.10）
image = "0.25"
smallvec = "1"

# 保存文件名的人类可读时间戳（gpui 生态已在依赖树中，零新增编译）
chrono = "0.4"

# 本地 vendor fork（上游 review 慢，先用补丁；上游合并后删除此段即可）
# - set_layer_margin：layer-shell 表面运行时改 margin（贴图拖动原语）
[patch.crates-io]
gpui-pre = { path = "/home/mengh04/Workspace/vendor/gpui-pre" }
gpui-pre-linux = { path = "/home/mengh04/Workspace/vendor/gpui-pre-linux" }
