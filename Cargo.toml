[package]
name = "shotori"
version = "0.8.0"
edition = "2024"
description = "Shotori — Wayland-first screenshot tool with optional OCR (gpui-kit)"
license = "MIT"
repository = "https://github.com/mengh04/shotori"
keywords = ["screenshot", "wayland", "gpui", "screencopy", "clipboard"]
categories = ["graphics", "multimedia::images", "command-line-utilities"]

[dependencies]
gpui-kit = "0.6"
anyhow = "1.0"

# screencopy capture + wlr-data-control clipboard (raw wayland-client)
wayland-client = "0.31"
wayland-protocols-wlr = "0.3"
memmap2 = "0.9"
tempfile = "3"
png = "0.18"

# In-memory pixels → gpui display (RenderImage is built from the image
# crate's Frames; must match gpui-pre's version, currently 0.25.10)
image = "0.25"
smallvec = "1"

# Human-readable timestamp for save filenames (chrono is already in the
# gpui dep tree — zero extra compile)
chrono = "0.4"

# Desktop notifications (org.freedesktop.Notifications over D-Bus).
# Sent from a detached child process (see src/notify.rs) so a quick
# cx.quit() can never cut a notification off
notify-rust = "4"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
niri-ipc = "26.4.0"
# window-snap backends: sway (i3 GET_TREE) and Hyprland (j/clients) speak
# JSON over their unix sockets; parsed with serde_json Values (their
# schemas drift across versions, tolerant field-by-field beats typed)
serde_json = "1"

# The pin (floating image) feature lives on the `pin` branch (it needs the
# vendored set_layer_margin patch); once upstream merges it, the branch can
# return to main without a [patch.crates-io] section
#
[dependencies.rapidocr-core]
version = "0.2"
default-features = false
features = ["model-download"]

# First-run model download with progress + cancel (same reqwest version as
# rapidocr-core's, features unify)
[dependencies.reqwest]
version = "0.12"
features = ["blocking", "rustls-tls"]
default-features = false

# Post-download integrity check (expected hashes ship in the model spec)
[dependencies.sha2]
version = "0.11"

[dev-dependencies]
gpui-kit = { version = "0.6", features = ["test-support"] }
