<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="none"
  role="img"
  aria-label="mosaic"
>
  <!-- Mosaic / pixelate. Lucide has no fitting glyph (its grids read as
       "table"), so this is shotori's own icon. Lucide conventions kept
       (24×24 canvas, currentColor) so it tints with the toolbar text
       color like every other icon. Five rounded cells in the classic
       checkerboard quincunx (corners + center, the dice-five spot) —
       user-picked from the candidate sheet; gaps read as the unfilled
       checker cells, no second color needed. -->
  <g fill="currentColor">
    <rect x="3" y="3" width="5" height="5" rx="1" />
    <rect x="16" y="3" width="5" height="5" rx="1" />
    <rect x="9.5" y="9.5" width="5" height="5" rx="1" />
    <rect x="3" y="16" width="5" height="5" rx="1" />
    <rect x="16" y="16" width="5" height="5" rx="1" />
  </g>
</svg>
