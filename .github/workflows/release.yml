name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: release-tarball-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: release-zip-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install native build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - name: Build release binary
        run: cargo build --release

      - name: Package (strip + tarball, Linux)
        if: runner.os == 'Linux'
        run: |
          strip target/release/shotori
          mkdir dist
          cp target/release/shotori LICENSE dist/
          tar -C dist -czf "shotori-${GITHUB_REF_NAME}-x86_64.tar.gz" shotori LICENSE

      - name: Package (zip, Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          cp target/release/shotori.exe LICENSE dist/
          Compress-Archive -Path dist/shotori.exe,dist/LICENSE `
            -DestinationPath "shotori-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: shotori-*

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-tarball-linux

      - uses: actions/download-artifact@v4
        with:
          name: release-zip-windows

      - name: Create release with artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACTS=$(ls shotori-*.tar.gz shotori-*.zip)
          gh release create "${GITHUB_REF_NAME}" $ARTIFACTS \
            --title "shotori ${GITHUB_REF_NAME}" \
            --generate-notes

  aur:
    # Bump the AUR package (pkgver + sha256) and push via the release key.
    # Requires the AUR_SSH_KEY secret (private key registered on AUR).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-tarball-linux
          path: artifact

      - name: Push PKGBUILD update to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm git openssh >/dev/null
          install -dm700 /root/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > /root/.ssh/aur
          chmod 600 /root/.ssh/aur
          # Point ssh AT the key (locally ~/.ssh/config does this; the
          # container has neither default keys nor a config — without it
          # auth falls through to "publickey denied")
          cat > /root/.ssh/config <<'EOF'
          Host aur.archlinux.org
              User aur
              IdentityFile /root/.ssh/aur
              IdentitiesOnly yes
          EOF
          ssh-keyscan -t ed25519 aur.archlinux.org >> /root/.ssh/known_hosts
          git config --global user.name "shotori-release-bot"
          git config --global user.email "mengh04@users.noreply.github.com"
          git clone ssh://aur@aur.archlinux.org/shotori.git aur
          cd aur
          SHA=$(sha256sum "../artifact/shotori-${GITHUB_REF_NAME}-x86_64.tar.gz" | cut -d' ' -f1)
          sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA}')/" PKGBUILD
          # makepkg refuses to run as root (exit 10); printsrcinfo only
          # prints, but the guard fires regardless — run it as a mortal
          useradd -m builder
          install -d -o builder -g builder /home/builder/work
          cp PKGBUILD /home/builder/work/
          su builder -s /bin/bash -c "cd ~/work && makepkg --printsrcinfo" > .SRCINFO
          git add PKGBUILD .SRCINFO
          git commit -m "shotori ${GITHUB_REF_NAME#v}-1"
          git push

  crates-io:
    # Publishes to crates.io. Skipped unless CARGO_REGISTRY_TOKEN is set
    # (crates.io/settings/tokens, publish-new + publish-update scopes).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io publish"
            exit 0
          fi
          cargo publish --token "$TOKEN"
